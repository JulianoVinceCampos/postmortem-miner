[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "postmortem-miner"
version = "0.1.0"
description = "Turns a pile of postmortems into a triage decision tree and candidate SLIs."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Juliano Vince" }]
keywords = ["sre", "postmortem", "incident-analysis", "slo", "observability"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: System :: Monitoring",
]
# Zero runtime dependencies. On purpose: this runs on any box with a stdlib Python,
# including a locked-down bastion during an incident.
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "hypothesis>=6.112",
  "ruff==0.8.4",  # igual ao pin do job de lint; ver .github/workflows/lint.yml
]

[project.scripts]
postmortem-miner = "postmortem_miner.cli:main"

[project.urls]
Homepage = "https://github.com/JulianoVinceCampos/postmortem-miner"
Issues = "https://github.com/JulianoVinceCampos/postmortem-miner/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/postmortem_miner"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "tools"]

[tool.ruff.lint]
select = [
  "E", "F", "W",   # pycodestyle / pyflakes
  "I",             # isort
  "UP",            # pyupgrade
  "B",             # bugbear
  "SIM",           # simplify
  "C4",            # comprehensions
  "RET",           # return
  "PTH",           # pathlib
  "ARG",           # unused args
  "PL",            # pylint subset
  "RUF",
]
ignore = ["PLR0913"]

[tool.ruff.lint.isort]
# `tools/` is on the test path, so its modules are first-party even though they are
# not part of the installed package.
known-first-party = ["postmortem_miner", "coverage_ratchet", "gen_corpus", "sanitize_scan"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004", "ARG001"]
# gen_corpus is a fixture made of prose: whole sentences in two languages. Wrapping
# them to satisfy a column limit makes the corpus harder to read and edit, and the
# sentences are the data, not code.
"tools/gen_corpus.py" = ["E501"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-q --strict-markers --strict-config"
testpaths = ["tests"]
# `tools/` is on the path so the CI helpers (sanitize, ratchet, corpus) are tested too.
# They gate every commit; untested gates are theatre.
pythonpath = ["src", "tools"]

[tool.coverage.run]
branch = true
source = ["src/postmortem_miner"]

[tool.coverage.report]
show_missing = true
exclude_lines = ["pragma: no cover", "if __name__ == .__main__.:", "raise NotImplementedError"]
