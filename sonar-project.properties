sonar.projectKey=JulianoVinceCampos_postmortem-miner
sonar.organization=julianovincecampos
sonar.projectName=postmortem-miner

sonar.sources=src,tools
sonar.tests=tests
sonar.python.version=3.11,3.12,3.13
sonar.python.coverage.reportPaths=coverage.xml

# New code is measured against main. The repo is greenfield, so the quality gate is
# enforced on both new and overall code - there is no legacy debt to grandfather in.
sonar.newCode.referenceBranch=main

# Without this the scan step goes green before Sonar has finished, and the "gate" is
# decorative. It is the most common way this integration is misconfigured.
sonar.qualitygate.wait=true
