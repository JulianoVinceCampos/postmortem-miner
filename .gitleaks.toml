title = "postmortem-miner"

[extend]
useDefault = true

[allowlist]
description = """
Documented placeholders used by the test fixtures and the synthetic corpus. Every entry
here is a value chosen precisely because it can never be real: RFC 5737 documentation
ranges and all-zero identifiers.
"""
regexes = [
  '''000000000000''',
  '''i-0EXAMPLE''',
  '''(?:192\.0\.2|198\.51\.100|203\.0\.113)\.\d{1,3}''',
]
paths = [
  # The scanner and the Semgrep rules contain the patterns themselves by definition.
  '''tools/sanitize_scan\.py''',
  '''\.semgrep/.*''',
  '''\.gitleaks\.toml''',
]
