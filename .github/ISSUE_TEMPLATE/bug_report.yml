name: Bug report
description: Something behaves differently from what the docs say
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Include the command you ran and what came back.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected instead
    validations:
      required: true

  - type: textarea
    id: input
    attributes:
      label: Minimal input that reproduces it
      description: >-
        A postmortem file, or the smallest snippet of one, that triggers the behaviour.
        Please strip anything real: hostnames, addresses, account ids, customer names.
        If the bug only shows up with sensitive content, describe the shape instead.
    validations:
      required: false

  - type: input
    id: version
    attributes:
      label: Version and Python
      placeholder: "postmortem-miner 0.1.0, Python 3.12.4"
    validations:
      required: true
