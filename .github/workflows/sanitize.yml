# Layer 2 of the pipeline and the only irreversible one. Two independent engines check
# the same intent, so a bug in either does not silently disable the gate.
name: sanitize

on:
  workflow_call:

permissions:
  contents: read

jobs:
  sanitize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: a leak in an old commit is still a leak.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Corporate context scan (stdlib, zero dependencies)
        run: python3 tools/sanitize_scan.py

      - name: Semgrep leak rules (second engine, same intent)
        uses: semgrep/semgrep-action@v1
        with:
          config: .semgrep/no-corp-leak.yml

      - name: Secret scan across the whole history
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
