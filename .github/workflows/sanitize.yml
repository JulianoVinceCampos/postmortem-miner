# Layer 2 of the pipeline and the only irreversible one. Two independent engines check
# the same intent, so a bug in either does not silently disable the gate.
name: sanitize

on:
  workflow_call:

permissions:
  contents: read

jobs:
  sanitize:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Full history: a leak in an old commit is still a leak.
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Corporate context scan (stdlib, zero dependencies)
        run: python3 tools/sanitize_scan.py

      - name: Semgrep leak rules (second engine, same intent)
        # Semgrep from pip rather than semgrep/semgrep-action: the action pins an
        # unsupported Semgrep version and expects an app token. One less third-party
        # action to keep pinned, same rules, same exit code.
        run: |
          python -m pip install --upgrade pip semgrep
          semgrep scan --config .semgrep/no-corp-leak.yml --error --quiet

      - name: Secret scan across the whole history
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
