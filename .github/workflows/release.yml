# Conventional Commits -> CHANGELOG -> tag, with no manual version bumping.
#
# Requires the repo setting "Allow GitHub Actions to create and approve pull requests"
# (Settings > Actions > General). Without it the action fails with
# "GitHub Actions is not permitted to create or approve pull requests".
name: release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        with:
          release-type: python
