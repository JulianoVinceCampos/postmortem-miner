name: sonar

on:
  workflow_call:

permissions:
  contents: read

jobs:
  sonarcloud:
    runs-on: ubuntu-latest
    # A fork PR has no access to the token. Skipping is correct; failing would teach
    # contributors that red is normal.
    if: github.event.pull_request.head.repo.full_name == github.repository || github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
        with:
          # Sonar needs history for blame and new-code detection.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Coverage report for Sonar
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pytest --cov --cov-report=xml

      - name: SonarCloud scan and quality gate
        uses: SonarSource/sonarqube-scan-action@v4
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
