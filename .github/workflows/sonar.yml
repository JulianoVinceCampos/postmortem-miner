name: sonar

on:
  workflow_call:

permissions:
  contents: read

jobs:
  sonarcloud:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # A fork PR has no access to the token, and so does a repo where SONAR_TOKEN has not
    # been configured yet. Skipping is correct; failing would teach contributors that red
    # is normal.
    if: github.event.pull_request.head.repo.full_name == github.repository || github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
        with:
          # Sonar needs history for blame and new-code detection.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Coverage report for Sonar
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pytest --cov --cov-report=xml

      - name: Check whether SONAR_TOKEN exists
        id: token
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -z "${SONAR_TOKEN}" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "SONAR_TOKEN not configured - skipping the scan instead of failing."
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - name: SonarCloud scan and quality gate
        if: steps.token.outputs.present == 'true'
        uses: SonarSource/sonarqube-scan-action@v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
