name: codeql

on:
  workflow_call:

# Ceiling, not default: must cover what the job requests.
permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: github/codeql-action/init@4187e74d05793876e9989daffde9c3e66b4acd07 # v3
        with:
          languages: python
          queries: security-and-quality
      - uses: github/codeql-action/analyze@4187e74d05793876e9989daffde9c3e66b4acd07 # v3
        # Deliberately without continue-on-error. A greenfield repo can afford to treat
        # CodeQL as blocking from commit one; retrofitting that onto a large codebase is
        # what makes teams mark it advisory and then ignore it forever.
