name: sca

on:
  workflow_call:

# Ceiling, not default: dependency-review comments on the PR, which needs write.
permissions:
  contents: read
  pull-requests: write

jobs:
  dependency-review:
    # The package itself has zero runtime dependencies, so this guards the dev and CI
    # surface - which is where supply-chain attacks actually land.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure

  audit:
    # pip-audit instead of a third-party scanner action: one less action version to
    # track, and it queries the same OSV/PyPI advisory data for the dev extras.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Audit dev and build dependencies
        run: |
          python -m pip install --upgrade pip pip-audit
          python -m pip install -e ".[dev]"
          pip-audit --strict --desc
