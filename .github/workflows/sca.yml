name: sca

on:
  workflow_call:

# Ceiling, not default: dependency-review comments on the PR, which needs write.
permissions:
  contents: read
  pull-requests: write

jobs:
  dependency-review:
    # The package itself has zero runtime dependencies, so this guards the dev and CI
    # surface - which is where supply-chain attacks actually land.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure

  audit:
    # pip-audit instead of a third-party scanner action: one less action version to
    # track, and it queries the same OSV/PyPI advisory data for the dev extras.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Audit dev and build dependencies
        run: |
          python -m pip install --upgrade pip pip-audit
          python -m pip install -e ".[dev]"
          pip-audit --strict --desc
