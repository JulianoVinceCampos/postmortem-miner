name: semgrep

on:
  workflow_call:

# Ceiling, not default: must cover what the job requests.
permissions:
  contents: read
  security-events: write

jobs:
  semgrep:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Semgrep SAST
        # From pip, not semgrep/semgrep-action: the action pins a Semgrep version that
        # the registry no longer supports and assumes an app token for findings upload.
        # Only rulesets that apply to this codebase - loading p/kotlin or p/nginx into a
        # Python repo produces noise, and noise is how a real finding gets ignored.
        run: |
          python -m pip install --upgrade pip semgrep
          semgrep scan \
            --config p/default \
            --config p/owasp-top-ten \
            --config p/secrets \
            --config p/python \
            --config p/ci \
            --sarif --output semgrep.sarif \
            --error

      - name: Upload SARIF to the Security tab
        uses: github/codeql-action/upload-sarif@4187e74d05793876e9989daffde9c3e66b4acd07 # v3
        if: always()
        with:
          sarif_file: semgrep.sarif
