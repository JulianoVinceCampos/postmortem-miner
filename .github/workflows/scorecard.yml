# OpenSSF Scorecard: an external, automated opinion on the maturity of this repo.
# Runs on a schedule rather than per PR because most of what it measures (branch
# protection, signed releases, dependency update policy) changes on repo settings, not
# on code.
name: scorecard

on:
  branch_protection_rule:
  schedule:
    - cron: "27 4 * * 1"
  push:
    branches: [main]

# Union of what the job needs. A narrower ceiling here refuses to start the workflow.
permissions:
  contents: read
  security-events: write
  id-token: write
  actions: read

jobs:
  analysis:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      id-token: write
      # Scorecard reads workflow runs to evaluate the CI-Tests and Token-Permissions
      # checks; without this it degrades those scores instead of failing loudly.
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      # `@v2` is not a published tag on this action - only full versions are. Resolved
      # from the releases API rather than guessed.
      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - uses: github/codeql-action/upload-sarif@4187e74d05793876e9989daffde9c3e66b4acd07 # v3
        with:
          sarif_file: results.sarif
