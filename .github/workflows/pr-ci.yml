# Three stages: cheap and irreversible first, expensive in parallel, evidence last.
#
# `sanitize` runs before `lint` on purpose. A style violation is fixed with a commit; a
# leaked identifier in a public history is permanent. So the check that guards the
# irreversible mistake is the one that runs first and fails fastest.
name: pr-ci

on:
  pull_request:
  push:
    branches: [main]

# The workflow-level block is a CEILING, not a default: a job cannot escalate above it,
# and the whole workflow refuses to start if one tries. So this is the union of what the
# jobs below need, and each job then narrows to its own minimum.
# Learned the hard way: `contents: read` here produced a startup_failure because
# security-events / id-token / attestations were requested downstream.
permissions:
  contents: read
  security-events: write
  id-token: write
  attestations: write
  pull-requests: write
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # --- stage 1: fail fast, sequential ---------------------------------------------
  sanitize:
    uses: ./.github/workflows/sanitize.yml

  lint:
    needs: sanitize
    uses: ./.github/workflows/lint.yml

  build-test:
    needs: lint
    uses: ./.github/workflows/build-test.yml

  # --- stage 2: parallel ----------------------------------------------------------
  coverage:
    needs: build-test
    uses: ./.github/workflows/coverage.yml

  semgrep:
    needs: build-test
    uses: ./.github/workflows/semgrep.yml
    permissions:
      contents: read
      security-events: write

  codeql:
    needs: build-test
    uses: ./.github/workflows/codeql.yml
    permissions:
      contents: read
      security-events: write
      actions: read

  sca:
    needs: build-test
    uses: ./.github/workflows/sca.yml
    permissions:
      contents: read
      pull-requests: write

  sonar:
    needs: coverage
    uses: ./.github/workflows/sonar.yml
    # Explicit instead of `secrets: inherit`: the called workflow gets exactly the one
    # secret it needs. `inherit` hands over every secret in the repo, which is how a
    # compromised or careless reusable workflow exfiltrates the rest of them.
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # --- stage 3: evidence ----------------------------------------------------------
  supply-chain:
    needs: [coverage, semgrep, codeql, sca]
    uses: ./.github/workflows/supply-chain.yml
    permissions:
      contents: read
      id-token: write
      attestations: write

  ci-status:
    # Single check to require in branch protection, so adding a job later does not mean
    # editing the ruleset.
    needs: [sanitize, lint, build-test, coverage, semgrep, codeql, sca, sonar, supply-chain]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any upstream job did not succeed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "one or more pipeline stages failed"
          exit 1
      - run: echo "pipeline green"
